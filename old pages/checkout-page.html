<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="We have been crafting high-quality rain jackets in a sustainable way, and have been a trusted companion for men and women all over the world since 1980.">
    <title>Rainy Days | Checkout</title>
    <link href="css/styles.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" 
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
    <link rel="icon" href="images/favicon.ico">
</head>
<body class="header-line">
<header>
    <nav class="main-nav">
        <div class="left-icons">
            <a href="index.html" class="logo">
                <img src="images/RainyDays_Logo-notext.png" alt="Rainy Days logo">
            </a>

            <div class="menu"> 
                <i class="fa-solid fa-bars fa-lg"></i> 
            </div> 

            <div class="user-icons"> 
                <i class="fa-solid fa-user fa-lg"></i> 
            </div>
        </div>

        <div class="right-icons"> 
            <i class="fa-solid fa-magnifying-glass fa-lg search"></i> 

            <a href="#" class="cart-icon">
                <i class="fa-solid fa-cart-shopping fa-lg cart"></i> 
                <span class="cart-number">1</span>
            </a>
        </div>
    </nav>
</header>
    <main>
        <h1 class="checkout-title">Checkout</h1>

        <section class="checkout-container">

            <div class="checkout-left">

                <div class="checkout-section">
                    <h3>Contact Information</h3>

                    <div class="input-row">
                        <input type="text" aria-label="First Name" placeholder="First Name" required>
                        <input type="text" aria-label="Last Name" placeholder="Last Name" required>
                    </div>

                    <div class="input-row">
                        <input type="text" aria-label="Email" placeholder="Email" required>
                        <input type="text" aria-label="Phone" placeholder="Phone" required>
                    </div>
                </div>

                <div class="checkout-section">
                    <h3>Shipping Address</h3>

                    <input type="text" aria-label="Street Address" placeholder="Street Address" class="full-width" required>

                    <div class="input-row">
                        <input type="text" aria-label="City" placeholder="City" required>
                        <input type="text" aria-label="State" placeholder="State" required>
                        <input type="text" aria-label="Zip Code" placeholder="Zip Code" required>
                    </div>
                </div>

                <div class="checkout-section">
                    <h3>Payment Information</h3>

                    <input type="text" aria-label="Card Number" placeholder="Card Number" class="full-width" required>
                    <input type="text" aria-label="Cardholder Name" placeholder="Cardholder Name" class="full-width" required>

                    <div class="input-row">
                        <input type="text" aria-label="MM/YY" placeholder="MM/YY" required>
                        <input type="text" aria-label="CVV" placeholder="CVV" required>
                    </div>
                </div>

                <a href="confirmation-page.html">
                <button class="complete-purchase-btn">Complete Purchase</button>
                </a>
            </div>

            <div class="checkout-right">
                <h3 class="checkout-summary-title">Order Summary</h3>

                    <div class="summary-top">
                        <img src="images/aqua-mini.svg" 
                        alt="Mini product picture of aquatrail rain jacket."
                        class="checkout-cart-image">

                        <div class="summary-text">
                            <div class="summary-item">
                                <span>AquaTrail Rain Jacket - Men</span>
                            </div>

                            <div class="summary-item-size">
                                <span>Size: S | Qty: 1</span>
                            </div>

                            <div class="summary-price">
                                <span>$165.99</span>
                            </div>
                        </div>
                    </div>

                <div class="summary-divider"></div>

                <div class="summary-item">
                    <span>Subtotal:</span>
                    <span>$165.99</span>
                </div>

                <div class="summary-item">
                    <span>Shipping:</span>
                    <span>Free</span>
                </div>

                <div class="checkout-summary-total">
                    <span>Total:</span>
                     <span>$165.99</span>
                </div>
            </div>
        </section>
    </main>
    </body>
</html>
