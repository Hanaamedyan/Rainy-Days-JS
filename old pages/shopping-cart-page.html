<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="We have been crafting high-quality rain jackets in a sustainable way, and have been a trusted companion for men and women all over the world since 1980.">
    <title>Rainy Days | Shopping Cart</title>
    <link href="css/styles.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" 
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
    <link rel="icon" href="images/favicon.ico">
</head>
<body class="header-line">
<header>
    <nav class="main-nav">
        <div class="left-icons">
            <a href="index.html" class="logo">
                <img src="images/RainyDays_Logo-notext.png" alt="Rainy Days logo">
            </a>

            <div class="menu"> 
                <i class="fa-solid fa-bars fa-lg"></i> 
            </div> 

            <div class="user-icons"> 
                <i class="fa-solid fa-user fa-lg"></i> 
            </div>
        </div>

        <div class="right-icons"> 
            <i class="fa-solid fa-magnifying-glass fa-lg search"></i> 

            <a href="#" class="cart-icon">
                <i class="fa-solid fa-cart-shopping fa-lg cart"></i> 
                <span class="cart-number">1</span>
            </a>
        </div>
    </nav>
</header>
    <main>
        <h1 class="cart-title">Shopping Cart</h1>
        
        <section class="cart-container">

            <div class="cart-left-wrap">
                    
                <div class="cart-left">
                    <div class="cart-product">
                        <img src="images/aqua-mini.svg" 
                        alt="Mini product picture of aquatrail rain jacket."
                        class="cart-image">

                        <div class="cart-info">
                            <h3 class="item-name">AquaTrail Rain Jacket - Men</h3>
                            <p class="item-size">Size: S</p>
                            <p class="item-price">$165.99</p>
                    
                            <div class="quantity">
                                <button class="quantity-btn">-</button>
                                <span class="quantity-number">1</span>
                                <button class="quantity-btn">+</button>
                            </div>
                        </div>
                    </div>

                        <a href="empty-cart-page.html" class="remove-btn" aria-label="remove item from cart">
                            <i class="fa-solid fa-trash-can"></i>
                        </a>

                </div>
            </div>

            <div class="cart-right">
                <h3 class="summary-title">Order Summary</h3>

                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span>$165.99</span>
                </div>

                <div class="summary-row">
                    <span>Shipping:</span>
                    <span>Free</span>
                </div>
                
                <div class="summary-line"></div>

                    <div class="summary-total">
                        <span>Total:</span>
                        <span>$165.99</span>
                    </div>

                <a href="checkout-page.html">
                    <button class="checkout-btn">Proceed to checkout</button>
                </a>

                <a href="products-page.html" 
                class="continue-shopping">Continue shopping
                </a>
            </div>
        </section>
    </main>
    </body>
</html>
